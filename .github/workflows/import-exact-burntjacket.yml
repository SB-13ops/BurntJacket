name: Import exact BurntJacket archive

on:
  push:
    paths:
      - '.bj5-014'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and unpack exact archive
        shell: bash
        run: |
          cat .bj5-* > /tmp/burntjacket.b64
          base64 -d /tmp/burntjacket.b64 > /tmp/burntjacket.zip
          echo "a1b2bc4c00b9a38410b82de557229cfd39f005879a23aef63aa38b5b6bd831de  /tmp/burntjacket.zip" | sha256sum -c -
          unzip -t /tmp/burntjacket.zip
          rm -rf /tmp/burntjacket-clean
          mkdir -p /tmp/burntjacket-clean
          unzip -o /tmp/burntjacket.zip -d /tmp/burntjacket-clean
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/burntjacket-clean/. .
      - name: Commit exact clean application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import exact cleaned BurntJacket application"
          git push
