name: Import clean BurntJacket archive v2

on:
  push:
    paths:
      - '.trigger-import-v2'
  pull_request:
    paths:
      - '.pr-import-trigger'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Rebuild repository from verified clean archive
        shell: bash
        run: |
          {
            cat .bj4-000
            cat .bj4-001
            cat .bj4-002
            cat .bj4-003
            cat .fix-004
            cat .fix-005
            cat .bj4-006
            cat .fix-007
            cat .bj4-008
            cat .fix-009
            cat .fix-010
            cat .bj4-011
            cat .bj4-012
            cat .fix-013
            cat .fix-014
          } > /tmp/burntjacket.b64
          base64 -d /tmp/burntjacket.b64 > /tmp/burntjacket.zip
          echo 'a1b2bc4c00b9a38410b82de557229cfd39f005879a23aef63aa38b5b6bd831de  /tmp/burntjacket.zip' | sha256sum -c -
          unzip -t /tmp/burntjacket.zip
          mkdir -p /tmp/burntjacket-clean
          unzip -o /tmp/burntjacket.zip -d /tmp/burntjacket-clean
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/burntjacket-clean/. .
      - name: Commit clean application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import cleaned BurntJacket application"
          git push origin main
