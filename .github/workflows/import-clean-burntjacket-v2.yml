name: Import clean BurntJacket archive v2

on:
  push:
    paths:
      - '.trigger-import-v2'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild repository from clean archive
        shell: bash
        run: |
          cat .bj4-[0-9][0-9][0-9] > /tmp/burntjacket.b64
          base64 -d -i /tmp/burntjacket.b64 > /tmp/burntjacket.zip
          unzip -t /tmp/burntjacket.zip
          mkdir -p /tmp/burntjacket-clean
          unzip -o /tmp/burntjacket.zip -d /tmp/burntjacket-clean
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/burntjacket-clean/. .
      - name: Commit clean application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import cleaned BurntJacket application"
          git push
