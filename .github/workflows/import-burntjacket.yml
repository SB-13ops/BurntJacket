name: Import BurntJacket archive

on:
  push:
    paths:
      - '.bj-import-038'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and unpack application
        shell: bash
        run: |
          cat .bj-import-* > /tmp/burntjacket.b64
          base64 -d /tmp/burntjacket.b64 > /tmp/burntjacket.zip
          unzip -t /tmp/burntjacket.zip
          mkdir -p /tmp/burntjacket-import
          unzip -o /tmp/burntjacket.zip -d /tmp/burntjacket-import
          rm -f .bj-import-* .burntjacket-import.zip.b64 .burntjacket-import.part*
          cp -a /tmp/burntjacket-import/. .
          rm -f .github/workflows/import-burntjacket.yml
      - name: Commit imported application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import cleaned BurntJacket application" || exit 0
          git push
