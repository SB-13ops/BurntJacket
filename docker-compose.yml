# Local development stack mirroring the Railway topology:
#   db (Postgres+pgvector) + redis + api (FastAPI) + web (Next.js)
#
# On Railway these become: a Postgres plugin, a Redis plugin, and two services
# built from apps/api/Dockerfile and apps/web/Dockerfile. Here they run together
# so local dev matches production.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: waxstack-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-waxstack}
      POSTGRES_USER: ${POSTGRES_USER:-waxstack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waxstack}
    ports:
      - "5432:5432"
    volumes:
      - waxstack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waxstack} -d ${POSTGRES_DB:-waxstack}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: waxstack-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    container_name: waxstack-api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      # Note the psycopg driver prefix; the app also normalizes plain URLs.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-waxstack}:${POSTGRES_PASSWORD:-waxstack}@db:5432/${POSTGRES_DB:-waxstack}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-insecure-jwt-secret-change-me}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-dev-insecure-token-key-change-me-0000000000=}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      DISCOGS_CONSUMER_KEY: ${DISCOGS_CONSUMER_KEY:-}
      DISCOGS_CONSUMER_SECRET: ${DISCOGS_CONSUMER_SECRET:-}
      DISCOGS_CALLBACK_URL: ${DISCOGS_CALLBACK_URL:-http://localhost:8000/api/v1/integrations/discogs/callback}
      TICKETMASTER_API_KEY: ${TICKETMASTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PORT: 8000
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      args:
        # Baked into the client bundle at build time (see apps/web/Dockerfile).
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000/api/v1}
    container_name: waxstack-web
    depends_on:
      - api
    environment:
      PORT: 3000
    ports:
      - "3000:3000"

volumes:
  waxstack_pgdata:
